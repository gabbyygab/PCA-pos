# Builds the macOS desktop app.
#
# This cannot run on the Windows dev machine: Tauri links against Apple's own
# frameworks (WebKit, AppKit), which ship only inside Xcode, and the .dmg is
# assembled by `hdiutil` — an Apple-only tool. A macOS runner is the whole point
# of this file.
#
# Built as `universal-apple-darwin`: one binary carrying both the Apple silicon
# and Intel slices, so a single .dmg runs natively on any Mac the shop owns and
# nobody has to know which chip is inside.
name: Desktop (macOS)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # A universal binary is two real compilations, so both targets must be
      # installed even though only one `tauri build` runs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # `tauri build` runs this again itself via beforeBuildCommand; running it
      # as its own step surfaces a TypeScript failure plainly instead of buried
      # in Rust output.
      - name: Build web bundle
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Build macOS bundle
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        # No --config override here: overriding `build` replaces the whole
        # object, which drops frontendDist and makes Tauri bundle no web
        # content. Let tauri.conf.json drive the build, exactly as the working
        # Windows builds do. beforeBuildCommand re-runs the export, which is
        # redundant with the step above but harmless.
        # --verbose so the log names the directory Tauri resolved frontendDist
        # to, and whether it copied anything out of it.
        run: npx tauri build --target universal-apple-darwin --bundles app dmg

      # Tauri compiles the static export into the executable rather than
      # copying it beside one, so Resources legitimately holds nothing but the
      # icon -- the Windows bundle that works looks exactly the same way. The
      # thing worth checking is therefore the binary: that the export was
      # embedded at all, and that the Supabase URL was inlined into it, since a
      # build with the secrets missing still succeeds and only fails later, at
      # every login, against `undefined`.
      #
      # The executable is named for the **Cargo binary** (`pca-pos`), not for
      # productName -- the bundler copies `target/<triple>/release/<bin_name>`
      # into `Contents/MacOS/<bin_name>`, and only the .app directory around it
      # takes the pretty name. So find whatever is in MacOS/ rather than
      # guessing at the name, which is what made this step fail on a bundle
      # that had built correctly.
      - name: Verify the binary carries the web app
        working-directory: web
        env:
          SUPA_HOST: uxdomhpxhcvaqqpryloq.supabase.co
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/PCA POS.app"
          BIN="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -u+x | head -1 || true)"
          if [ -z "$BIN" ]; then
            echo "::error::no executable inside $APP/Contents/MacOS"
            find "src-tauri/target/universal-apple-darwin/release/bundle" -maxdepth 4 || true
            exit 1
          fi
          echo "found executable: $BIN"
          # A universal build is only universal if lipo actually fused both
          # slices; a single-arch binary here still runs on the build machine
          # and would ship broken to the other kind of Mac.
          lipo -info "$BIN"
          if ! grep -qa "_next/static" "$BIN"; then
            echo "::error::the static export is not embedded in the binary"
            exit 1
          fi
          if ! grep -qa "$SUPA_HOST" "$BIN"; then
            echo "::error::the Supabase URL is not inlined - check the repo secrets"
            exit 1
          fi
          echo "binary OK: static export embedded and Supabase URL inlined"

      # Unsigned, so macOS quarantines it on download — see the testing guide in
      # CLAUDE.md for the one-line fix the tester runs.
      - uses: actions/upload-artifact@v4
        with:
          name: pca-pos-macos-universal
          if-no-files-found: error
          path: |
            web/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            web/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
