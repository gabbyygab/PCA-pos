[package]
name = "pca-pos"
version = "0.1.0"
description = "Point of sale and payroll for PCA car wash."
authors = ["PCA"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pca_pos_lib"
# staticlib/cdylib are only needed for mobile targets; a desktop-only build links
# the lib directly into the binary. Building a DLL here overflows MinGW's export
# ordinal limit on Tauri's dependency tree.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
